name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23.5'

    - name: Build
      run: |
        CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -o dilshan-x-ui main.go
        
    - name: Create Release Archive
      run: |
        tar -czvf dilshan-x-ui-linux-amd64.tar.gz dilshan-x-ui
        
    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dilshan-x-ui-linux-amd64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifact (for workflow_dispatch)
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/upload-artifact@v4
      with:
        name: dilshan-x-ui-linux-amd64
        path: dilshan-x-ui-linux-amd64.tar.gz
