<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<style>
  :root {
    --dx-primary: #00E5CC;
    --dx-bg: #0A0E17;
    --dx-card: rgba(15, 22, 35, 0.85);
    --dx-border: rgba(255, 255, 255, 0.06);
    --dx-text: #E8ECF4;
    --dx-text-muted: #6B7A99;
    --dx-text-dim: #3D4F6F;
  }

  html * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

  body {
    background: var(--dx-bg) !important;
    font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
    overflow: hidden;
    margin: 0;
  }

  /* ===== Animated Gradient Mesh Background ===== */
  .dx-bg-mesh {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0; overflow: hidden;
  }

  .dx-bg-mesh::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: 
      radial-gradient(ellipse at 20% 50%, rgba(0, 229, 204, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(0, 144, 217, 0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(99, 102, 241, 0.04) 0%, transparent 50%);
    animation: dx-mesh-move 20s ease-in-out infinite alternate;
  }

  .dx-bg-mesh::after {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: 
      radial-gradient(circle at 30% 70%, rgba(0, 229, 204, 0.04) 0%, transparent 40%),
      radial-gradient(circle at 70% 30%, rgba(0, 144, 217, 0.03) 0%, transparent 40%);
    animation: dx-mesh-move 15s ease-in-out infinite alternate-reverse;
  }

  @keyframes dx-mesh-move {
    0% { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(-3%, 2%) rotate(3deg); }
  }

  /* Grid Pattern Overlay */
  .dx-grid-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* Floating Orbs */
  .dx-orb {
    position: fixed; border-radius: 50%;
    filter: blur(80px); z-index: 0;
    animation: dx-float 12s ease-in-out infinite alternate;
  }
  .dx-orb-1 { width: 400px; height: 400px; top: -100px; right: -100px; background: rgba(0, 229, 204, 0.08); animation-duration: 14s; }
  .dx-orb-2 { width: 300px; height: 300px; bottom: -80px; left: -80px; background: rgba(0, 144, 217, 0.06); animation-duration: 18s; animation-delay: -3s; }
  .dx-orb-3 { width: 200px; height: 200px; top: 40%; left: 20%; background: rgba(99, 102, 241, 0.04); animation-duration: 16s; animation-delay: -7s; }

  @keyframes dx-float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, -20px) scale(1.1); }
  }

  /* ===== Login Card ===== */
  #login {
    animation: dx-card-in 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    background: var(--dx-card) !important;
    backdrop-filter: blur(24px) saturate(180%) !important;
    -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
    border: 1px solid var(--dx-border) !important;
    border-radius: 24px !important;
    padding: 48px 40px !important;
    box-shadow: 
      0 24px 48px rgba(0, 0, 0, 0.4),
      0 0 0 1px rgba(255, 255, 255, 0.03) inset,
      0 0 80px rgba(0, 229, 204, 0.04);
    max-width: 440px;
    width: 100% !important;
    margin: 0 auto !important;
    position: relative;
    z-index: 1;
    user-select: none;
    -webkit-user-select: none;
  }

  @keyframes dx-card-in {
    from { transform: translateY(30px) scale(0.97); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  /* Top accent line */
  #login::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00E5CC, #0090D9, transparent);
    border-radius: 0 0 2px 2px;
  }

  /* ===== Logo & Branding ===== */
  .dx-brand {
    text-align: center;
    margin-bottom: 36px;
  }

  .dx-brand-icon {
    width: 56px; height: 56px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(0, 229, 204, 0.15) 0%, rgba(0, 144, 217, 0.1) 100%);
    border: 1px solid rgba(0, 229, 204, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-size: 24px;
    animation: dx-glow-pulse 3s ease-in-out infinite;
  }

  @keyframes dx-glow-pulse {
    0%, 100% { box-shadow: 0 0 20px rgba(0, 229, 204, 0.1); }
    50% { box-shadow: 0 0 30px rgba(0, 229, 204, 0.2); }
  }

  .dx-brand-name {
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, #00E5CC, #0090D9);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.03em;
    margin-bottom: 6px;
  }

  .dx-brand-sub {
    font-size: 13px;
    color: var(--dx-text-muted);
    font-weight: 400;
    letter-spacing: 0.02em;
  }

  /* ===== Form Inputs ===== */
  .ant-form-item { margin-bottom: 20px; }

  .ant-input-wrapper.ant-input-group {
    display: flex !important;
    align-items: stretch !important;
    width: 100% !important;
  }

  .ant-input-affix-wrapper,
  .ant-input {
    background: rgba(15, 22, 35, 0.9) !important;
    border: 1px solid var(--dx-border) !important;
    border-radius: 12px !important;
    height: 50px !important;
    padding: 0 18px !important;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
    box-shadow: none !important;
    color: var(--dx-text) !important;
    font-size: 14.5px !important;
    font-weight: 400 !important;
  }

  .ant-input-affix-wrapper:hover,
  .ant-input:hover {
    background: rgba(15, 22, 35, 0.9) !important;
    border-color: rgba(0, 229, 204, 0.25) !important;
  }

  .ant-input-affix-wrapper-focused,
  .ant-input:focus,
  .ant-input-focused {
    background: rgba(15, 22, 35, 0.9) !important;
    border-color: #00E5CC !important;
    box-shadow: 0 0 0 3px rgba(0, 229, 204, 0.1) !important;
  }

  .ant-input::placeholder { color: var(--dx-text-dim) !important; }

  /* Webkit Autofill Fix */
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus {
    -webkit-text-fill-color: #E8ECF4 !important;
    caret-color: #E8ECF4 !important;
    -webkit-box-shadow: 0 0 0 1000px rgba(15, 22, 35, 0.95) inset !important;
    transition: background-color 5000s ease-in-out 0s;
  }

  /* Password addon */
  .ant-input-group-addon {
    background: rgba(15, 22, 35, 0.9) !important;
    border: 1px solid var(--dx-border) !important;
    border-left: none !important;
    border-radius: 0 12px 12px 0 !important;
    color: var(--dx-text-muted) !important;
    padding: 0 16px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    height: 50px !important;
    transition: all 0.3s ease !important;
  }
  .ant-input-group-addon .anticon { color: var(--dx-text-dim) !important; font-size: 16px !important; cursor: pointer; }
  .ant-input-group-addon .anticon:hover { color: #00E5CC !important; }
  .ant-input-group .ant-input-affix-wrapper { border-radius: 12px 0 0 12px !important; }

  /* Remove default outlines */
  .ant-input:focus, .ant-btn:focus, .ant-select:focus, .ant-select-selection:focus {
    outline: none !important;
  }

  /* ===== Login Button ===== */
  .centered { display: flex; text-align: center; align-items: center; justify-content: center; width: 100%; }

  .wave-btn-bg {
    position: relative; width: 100%;
    transition: all 0.3s ease;
    display: flex !important; justify-content: center !important;
  }

  .ant-btn-primary-login {
    width: 100% !important;
    height: 50px !important;
    border-radius: 12px !important;
    font-weight: 700 !important;
    font-size: 15px !important;
    letter-spacing: 0.03em !important;
    background: linear-gradient(135deg, #00E5CC 0%, #0090D9 100%) !important;
    border: none !important;
    color: #0A0E17 !important;
    box-shadow: 0 4px 20px rgba(0, 229, 204, 0.35) !important;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }

  .ant-btn-primary-login:hover {
    background: linear-gradient(135deg, #00CDB6 0%, #007BC0 100%) !important;
    box-shadow: 0 8px 30px rgba(0, 229, 204, 0.5) !important;
    transform: translateY(-2px) !important;
  }

  .ant-btn-primary-login:active {
    transform: translateY(0) !important;
    box-shadow: 0 2px 12px rgba(0, 229, 204, 0.3) !important;
  }

  /* ===== Language Select ===== */
  .ant-select { width: 100% !important; }
  .ant-select-selection {
    background: rgba(15, 22, 35, 0.9) !important;
    border: 1px solid var(--dx-border) !important;
    border-radius: 12px !important;
    color: var(--dx-text) !important;
    height: 44px !important;
    display: flex !important;
    align-items: center !important;
    box-shadow: none !important;
  }
  .ant-select-selection:hover { border-color: rgba(0, 229, 204, 0.25) !important; }
  .ant-select-selection__rendered {
    margin: 0 !important; padding: 0 16px !important; height: 100% !important;
    display: flex !important; align-items: center !important; line-height: 44px !important;
  }
  .ant-select-arrow { color: var(--dx-text-muted) !important; right: 16px !important; }

  /* ===== Footer ===== */
  .dx-login-footer {
    text-align: center;
    margin-top: 24px;
    font-size: 12px;
    color: var(--dx-text-dim);
    letter-spacing: 0.02em;
  }

  .dx-login-footer a {
    color: var(--dx-primary);
    text-decoration: none;
  }

  /* ===== Mobile ===== */
  @media (max-width: 576px) {
    #login { padding: 32px 24px !important; border-radius: 20px !important; }
    .dx-brand-name { font-size: 24px; }
  }
</style>
<body>
  <a-layout id="app" v-cloak :class="themeSwitcher.currentTheme">
    <transition name="list" appear>
      <a-layout-content style="min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;">
        
        <!-- Animated Background -->
        <div class="dx-bg-mesh"></div>
        <div class="dx-grid-overlay"></div>
        <div class="dx-orb dx-orb-1"></div>
        <div class="dx-orb dx-orb-2"></div>
        <div class="dx-orb dx-orb-3"></div>

        <!-- Login Card -->
        <a-row type="flex" justify="center" align="middle" style="width: 100%; position: relative; z-index: 1; padding: 24px;">
          <a-col :xs="22" :sm="20" :md="14" :lg="10" :xl="8" :xxl="6" id="login">
            
            <!-- Brand -->
            <div class="dx-brand">
              <div class="dx-brand-icon">🛡️</div>
              <div class="dx-brand-name">Dilshan X-UI</div>
              <div class="dx-brand-sub">Advanced Xray Management Panel</div>
            </div>

            <!-- Login Form -->
            <a-row type="flex" justify="center">
              <a-col span="24">
                <a-form>
                  <a-form-item>
                    <a-input autocomplete="username" name="username" v-model.trim="user.username" placeholder='{{ i18n "username" }}'
                             @keydown.enter.native="login" autofocus>
                    </a-input>
                  </a-form-item>
                  <a-form-item>
                    <password-input autocomplete="password" name="password" v-model.trim="user.password"
                                    placeholder='{{ i18n "password" }}'
                                    @keydown.enter.native="login">
                    </password-input>
                  </a-form-item>
                  <a-form-item v-if="secretEnable">
                    <password-input autocomplete="secret" name="secret" v-model.trim="user.loginSecret"
                                    placeholder='{{ i18n "secretToken" }}'
                                    @keydown.enter.native="login">
                    </password-input>
                  </a-form-item>
                  <a-form-item>
                    <a-row justify="center" class="centered">
                      <div class="wave-btn-bg" :style="loading ? { width: '52px' } : { width: '100%' }">
                        <a-button class="ant-btn-primary-login" type="primary"
                                  :loading="loading" @click="login"
                                  :icon="loading ? 'poweroff' : undefined">
                                  [[ loading ? '' : '{{ i18n "login" }}' ]]
                        </a-button>
                      </div>
                    </a-row>
                  </a-form-item>
                  <a-form-item>
                    <a-row justify="center" class="centered" style="margin-top: 4px;">
                      <a-col :span="24" style="text-align: center;">
                        <a-select ref="selectLang" v-model="lang"
                                  @change="setLang(lang)"
                                  :dropdown-class-name="themeSwitcher.currentTheme">
                          <a-select-option :value="l.value" label="English" v-for="l in supportLangs">
                            <span role="img" aria-label="l.name" v-text="l.icon"></span>
                            &nbsp;&nbsp;<span v-text="l.name"></span>
                          </a-select-option>
                        </a-select>
                      </a-col>
                    </a-row>
                  </a-form-item>
                  <a-form-item>
                    <a-row justify="center" class="centered">
                      <theme-switch-login></theme-switch-login>
                    </a-row>
                  </a-form-item>
                </a-form>
              </a-col>
            </a-row>

            <!-- Footer -->
            <div class="dx-login-footer">
              Powered by <a href="https://github.com/MasterHide/X-SL" target="_blank">Dilshan X-UI</a>
            </div>
          </a-col>
        </a-row>
      </a-layout-content>
    </transition>
  </a-layout>
{{template "js" .}}
{{template "component/themeSwitcher" .}}
{{template "component/password" .}}
<script>
  class User {
    constructor() {
      this.username = "";
      this.password = "";
    }
  }
  const app = new Vue({
    delimiters: ['[[', ']]'],
    el: '#app',
    data: {
      themeSwitcher,
      loading: false,
      user: new User(),
      secretEnable: false,
      lang: ""
    },
    async created() {
      this.lang = getLang();
      this.secretEnable = await this.getSecretStatus();
    },
    methods: {
      async login() {
        this.loading = true;
        const msg = await HttpUtil.post('/login', this.user);
        this.loading = false;
        if (msg.success) {
          location.href = basePath + 'panel/';
        }
      },
      async getSecretStatus() {
        this.loading = true;
        const msg = await HttpUtil.post('/getSecretStatus');
        this.loading = false;
        if (msg.success) {
          this.secretEnable = msg.obj;
          return msg.obj;
        }
      },
    },
  });
</script>
</body>
</html>
